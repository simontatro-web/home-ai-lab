# M5: the largest run. Changes from M4: 20 layers, width 1280, full multi-head
# attention (20 KV heads), lower learning rate (2.5e-4), warmup 6000.
run_name: model5_457M
model: {n_layer: 20, d_model: 1280, n_heads: 20, n_kv_heads: 20, ctx: 2048}
data_dir: data/clean
lr: 2.5e-4
schedule: cosine
warmup_steps: 6000
grad_clip: 1.0
max_steps: 138900      # ~9.1B tokens on 2 GPUs (2 x 16 x 2048 tokens/step)
batch_size: 16
log_every: 2000
eval_every: 10000
out_dir: runs/model5_457M
